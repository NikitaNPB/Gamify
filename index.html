<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mein Gaming-Paradies</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a; /* Dunkler Hintergrund */
            color: #f0f0f0; /* Helle Textfarbe */
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #00bcd4; /* Türkis für die Hauptüberschrift */
            margin-bottom: 30px;
        }
        h2 {
            color: #ff9800; /* Orange für die Spielüberschriften */
            margin-top: 40px;
            margin-bottom: 20px;
        }
        iframe {
            display: block; /* Zentriert den Iframe */
            margin: 0 auto; /* Zentriert den Iframe */
            max-width: 900px; /* Begrenzt die maximale Breite */
            width: 100%; /* Sorgt für responsive Breite */
            height: 600px; /* Feste Höhe */
            border: none;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.5); /* Leichter Schatten */
            border-radius: 10px; /* Abgerundete Ecken */
        }
        /* Spezielles Styling für Marble Quest, falls gewünscht */
        .marble-quest-frame {
            border: 4px solid #333;
        }
    </style>
</head>
<body>

    <h1>Mein Gaming-Paradies 🕹️</h1>

    <h2>Marble Quest 🎱</h2>
    <iframe 
        src="https://microstudio.io/HomineLudens/marblequest/" 
        class="marble-quest-frame"
        allowfullscreen="true">
    </iframe>

    <h2>Cookie Clicker Pro 🍪</h2>
    <iframe 
        src="https://cloud.onlinegames.io/games/2025/unity/cookie-clicker-pro/index-og.html" 
        allowfullscreen="true"
        referrerpolicy="no-referrer">
    </iframe>

</body>
</html>
